<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala ao vivo — PUMP FUN COPY</title>
<meta name="theme-color" content="#0b1020">
<!-- 0.32.480 (pedido do dono): atalho na tela de início do iPhone e do Android com ícone próprio e nome FUN BOT -->
<meta name="application-name" content="FUN BOT">
<meta name="apple-mobile-web-app-title" content="FUN BOT">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/fun-bot-180.png?v=__V__">
<link rel="manifest" href="/static/sala.json?v=__V__">
<link rel="icon" type="image/png" sizes="192x192" href="/static/fun-bot-192.png?v=__V__">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* 0.32.266 (pedido do dono): Sala ao vivo — cena em pixel art de um trader que reage às compras e vendas da conta, para
     transmitir em live (OBS: capturar esta janela). Só mostra dados da própria conta; não manda ordem nenhuma. */
  :root{--bg:#0b1020;--panel:#111a33;--line:#2a3c6b;--neon:#3df2c4;--green:#3ee66b;--red:#ff4d5e;--yellow:#ffd23f;--text:#e8f0ff;--muted:#8fa3d1}
  *{box-sizing:border-box}
  /* 0.32.300 (pedido do dono: "não consigo usar o zoom; a página tem que se adaptar à tela, celular, tablet e PC"): a sala ocupa a
     altura da janela (100dvh) e o palco 16:9 cresce até onde cabe na largura E na altura (container query); com zoom ou janela
     pequena tudo diminui junto em vez de sair da tela. No celular em pé vira coluna e a página rola. */
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"VT323",monospace;font-size:clamp(15px,1.3vw,20px);overflow-x:hidden}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  canvas,img.px{image-rendering:pixelated;image-rendering:crisp-edges}
  .pf{font-family:"Press Start 2P",monospace;letter-spacing:.02em}
  .top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:3px solid var(--line);background:#0e1730;flex-wrap:wrap}
  .brand{font-size:16px;color:var(--neon);text-shadow:0 0 8px rgba(61,242,196,.5);white-space:nowrap}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#fff;background:var(--red);padding:5px 8px;border-radius:3px}
  .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  .ctl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;transition:opacity .4s}
  .ctl.hide{opacity:0;pointer-events:none}
  .btn{font-family:"Press Start 2P",monospace;font-size:10px;background:#18264a;color:var(--text);border:2px solid var(--line);padding:8px 10px;cursor:pointer;border-radius:3px}
  .btn.on{background:var(--neon);color:#06221b;border-color:var(--neon)}
  .btn.real.on{background:var(--yellow);border-color:var(--yellow);color:#2a1d00}
  .sub{padding:6px 16px;font-size:11px;color:var(--muted);border-bottom:2px solid #16224a;background:#0c1428}
  .grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,27vw,400px);gap:12px;padding:10px 16px}
  .stwrap{min-width:0;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;border:3px solid var(--line);background:#000;aspect-ratio:16/9;overflow:hidden;width:min(100cqw,calc(100cqh * 16 / 9));container-type:inline-size}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
  .hud{background:#060c1c;border:2px solid var(--line);padding:7px 10px;font-size:12px;white-space:nowrap}
  .hud b.up{color:var(--green)}.hud b.down{color:var(--red)}.hud b.flat{color:var(--yellow)}
  .hud.up{border-color:var(--green)}.hud.flat{border-color:var(--yellow)}
  .hud.down{border-color:var(--red);animation:alarm 1s steps(2) infinite}
  @keyframes alarm{50%{background:#3a0d12}}
  .alert{position:absolute;top:5%;left:3%;width:min(46%,320px);background:#2a0b12;border:3px solid var(--red);box-shadow:4px 4px 0 #000;transform:translateY(-30px);opacity:0;visibility:hidden;transition:transform .35s steps(5),opacity .35s steps(5),visibility 0s .35s}
  .alert.show{transform:none;opacity:1;visibility:visible;transition:transform .35s steps(5),opacity .35s steps(5)}
  .alert.win{background:#08240f;border-color:var(--green)}
  .alert .ah{display:flex;justify-content:space-between;background:var(--red);color:#fff;font-size:10px;padding:5px 7px}
  .alert.win .ah{background:var(--green);color:#03210b}
  .alert .ab{padding:10px;font-size:clamp(12px,3.4cqw,24px);line-height:1.15}
  .flash{position:absolute;inset:0;pointer-events:none;opacity:0}
  .flash.go{animation:fl .5s steps(4)}
  @keyframes fl{0%{opacity:.75}100%{opacity:0}}
  .stats{position:absolute;left:3%;bottom:4%;display:flex;gap:8px;flex-wrap:wrap;max-width:94%}
  .st{background:rgba(5,10,25,.85);border:2px solid var(--line);padding:3px 7px;font-size:clamp(11px,2.2cqw,20px)}
  .st small{color:var(--muted)}
  @container (max-width:760px){.stats{display:none}}   /* palco pequeno: a evolução da carteira desenhada na mesa já mostra o resultado */
  .side{position:relative;min-height:0;container-type:inline-size}
  .pos{font-size:clamp(11px,5.4cqw,22px)}
  /* 0.32.305 (pedido do dono): Histórico das posições embaixo das abertas; as duas listas dividem a altura do painel */
  .side .col{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px}
  .side .col .box{flex:1 1 0}.side .col .box.hist{flex:1.2 1 0}.side .col .box.holdb{flex:.7 1 0}
  .box{border:3px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .box h3{margin:0;padding:8px 10px;font-size:11px;border-bottom:3px solid var(--line);color:var(--neon)}
  .box h3 span{color:var(--muted);font-family:"VT323",monospace;font-size:16px;margin-left:6px}
  .chat{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;gap:6px;min-height:240px}
  .msg{line-height:1.05;animation:up .35s steps(4)}
  .msg b{display:block;font-size:17px}
  @keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .pos{flex:1;min-height:0;overflow:auto;padding:4px 6px}
  /* 0.32.300: coluna Hora (entrada); fonte menor para caber a 5ª coluna */
  /* 0.32.362 (pedido do dono): visual da SALA LIVE do BOT LIVE — a maior letra que cabe na largura do painel, sempre em uma linha */
  .ph,.pr{display:grid;grid-template-columns:minmax(4ch,1fr) 5ch 7.1ch 6.6ch 7.4ch;gap:.25em;align-items:center;padding:.12em .3em}
  /* 0.32.368: Forex — símbolo de 6 letras (EURUSD) cabe inteiro */
  .fx .ph,.fx .pr{grid-template-columns:minmax(6.2ch,1fr) 5ch 7.1ch 6.6ch 5.6ch}
  .pr{border-bottom:1px solid #1a2850;font-size:clamp(13px,calc((100cqi - 36px) / 14),32px);line-height:1.05}
  .ph{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:clamp(13px,calc((100cqi - 36px) / 14),32px);border-bottom:2px solid #1c2c57}
  .ph span{white-space:nowrap;overflow:hidden}
  /* 0.32.498 (pedido do dono): Histórico com a coluna Lucro (6 colunas, letra um pouco menor para caber) */
  .ph.h6,.pr.h6{grid-template-columns:minmax(4ch,1fr) 5ch 6ch 6ch 6.6ch 6.8ch;font-size:clamp(11px,calc((100cqi - 36px) / 21),26px)}
  .fx .ph.h6,.fx .pr.h6{grid-template-columns:minmax(6.2ch,1fr) 5ch 6.4ch 6.4ch 7ch 5.6ch}
  .pr .hr{color:var(--muted)}
  .prmc{font-size:clamp(11px,calc((100cqi - 36px) / 20),22px);color:var(--muted);padding:0 .3em .25em;border-bottom:1px solid #1a2850;margin-top:-1px}
  .pr:has(+.prmc){border-bottom:0}
  .sacard .prmc{grid-column:1/-1;border:0;padding:0;margin:0;font-size:12px}
  .prmc .up{color:var(--green)}.prmc .down{color:var(--red)}
  .pr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph span:not(:first-child),.pr span:not(:first-child){text-align:right}
  .pr .pc{font-weight:bold;overflow:visible}
  .empty{color:var(--muted);padding:10px}
  .tick{flex:0 0 auto;margin:0 16px 12px;border:3px solid var(--line);background:#0c1428;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
  .tick .lab{background:var(--line);padding:10px;font-size:11px;flex:0 0 auto}
  .tick .run{display:inline-block;padding-left:100%;animation:run 30s linear infinite;font-size:1.1em}
  .tick .run span{margin-right:28px}
  @keyframes run{to{transform:translateX(-100%)}}
  .up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--yellow)}
  .risk{color:#facc15;font-weight:bold}
  .pr a.tkl{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.35)}.pr a.tkl:hover{color:#7dd3fc;border-bottom-color:#7dd3fc}
  .err{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3a0d12;border:3px solid var(--red);padding:10px 14px;z-index:9;max-width:92vw}
  /* 0.32.333 (pedido do dono, com referências de pixel art): janelas retrô com barra de título, ícones e borda em degraus;
     LOG DO ROBÔ em estilo terminal */
  .box{border:0;box-shadow:0 0 0 3px #0a0f20,0 0 0 6px var(--line),6px 6px 0 6px #050914;margin:6px}
  .box h3{display:flex;align-items:center;gap:6px;background:linear-gradient(#24407e,#1a2f5e);color:#fff;text-shadow:2px 2px 0 #0a0f20;border-bottom:3px solid #0a0f20}
  .box h3 .ico{flex:0 0 auto;height:16px;width:auto}
  .box h3 .dots{margin-left:auto;display:flex;gap:4px}
  .box h3 .dots b{width:8px;height:8px;background:#3df2c4;box-shadow:0 0 0 2px #0a0f20}
  .box h3 .dots b:nth-child(2){background:#ffd23f}.box h3 .dots b:nth-child(3){background:#ff4d5e}
  /* 0.32.470: botões US$ / SOL / ETH no título do Histórico (valem também para as Posições abertas) */
  .box.hist h3{flex-wrap:wrap}.box.hist h3 .dots{display:none}
  .box h3 .cur{margin-left:auto;display:flex;gap:4px;font-style:normal}
  .box h3 .cur button{font-family:"VT323",monospace;font-size:17px;line-height:1;padding:2px 6px;background:#0a1226;color:var(--muted);border:2px solid #0a0f20;cursor:pointer}
  .box h3 .cur button.on{background:var(--neon);color:#06221b;text-shadow:none}
  .box h3 .cur button:disabled{opacity:.4;cursor:default}
  @media (max-width:700px){.box h3 .cur button{font-size:19px;padding:6px 10px}}
  .side .col{gap:14px;padding:4px}
  .side .col .box.logb{flex:1 1 0}
  .log{flex:1;min-height:0;overflow:auto;background:#020a06;padding:6px 8px;font-family:"VT323",monospace;font-size:clamp(13px,4.6cqw,19px);line-height:1.05;color:#3ee66b}
  .log .ll{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0;border-bottom:1px dashed #0c2a18}
  .log .lt{color:#4f7a5e;margin-right:6px}.log .lr{color:#7fa58c}
  .log .ll.no b{color:#8fa3d1}.log .ll.wait b{color:#6fd3ff}.log .ll.real b{color:#ffd23f}.log .ll.bad b{color:#ff4d5e}.log .ll.sell b{color:#ff9f1c}.log .ll.ok b{color:#3ee66b}
  .log .ll.new{animation:typein .8s steps(12)}
  @keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .log .cur{color:#3ee66b;animation:blink 1s steps(2) infinite}
  .ico{height:1.1em;width:auto;vertical-align:-0.15em;margin-right:4px}
  .alert{border-width:4px;box-shadow:6px 6px 0 #000;top:auto;bottom:5%;left:2%;transform:translateY(30px)}
  .stage .stats{display:none}
  .mood{font-size:10px}.mood.m-euforia,.mood.m-feliz{border-color:var(--green);color:var(--green)}.mood.m-atento{border-color:#6fd3ff;color:#6fd3ff}
  .mood.m-dedicado{border-color:#ff9f1c;color:#ff9f1c}.mood.m-nervoso{border-color:var(--red);color:var(--red);animation:alarm 1s steps(2) infinite}   /* o resultado agora é desenhado na mesa (placar e carteira) */
  .alert .ah{align-items:center}.alert .ah .ico{height:16px}
  .tick .run .ico{height:1em}
  /* 0.32.362: LOG DO ROBÔ numa faixa de uma linha acima dos ÚLTIMOS TRADES; cena e painel alinhados (--sth/--gh vêm do sala.js) */
  .log .ll.one{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .log .ll.one .lt{margin:0;flex:0 0 auto}
  .log .ll.one .tk{color:#f5d0fe;font-weight:bold;flex:0 0 auto;max-width:45%;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .log .ll.one b{flex:0 0 auto}.log .ll.one .nx{color:#ffd23f;flex:0 0 auto}
  .tick.logbar{margin-bottom:6px}
  .tick.logbar .lab{display:flex;align-items:center;gap:6px}.tick.logbar .lab .ico{height:14px}
  .log.logline{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;background:#020a06;overflow:hidden;padding:0 12px;font-size:1.1em;line-height:1}
  .log.logline .ll.one{flex:1;min-width:0;border:0;padding:0}
  .log .ll.one .bk{color:#0b1a12;background:#ffd23f;font-weight:bold;padding:0 4px;flex:0 0 auto}
  .log .ll.one.bst .tk{color:#f5d0fe}
  .log.logline .lmot{color:#7fa58c;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .log.logline .cur,.log.logline .empty{display:none}
  .brand{color:#c084fc;text-shadow:0 0 8px rgba(192,132,252,.5)}
  @media (min-width:981px),(orientation:landscape) and (min-width:701px){
    .grid{grid-template-columns:minmax(0,1fr) clamp(230px,22vw,340px)}
    .side{align-self:center;height:min(var(--sth,100%),100%)}
    .grid.fit{grid-template-columns:minmax(0,calc((var(--gh) - 6px) * 16 / 9 + 6px)) minmax(clamp(230px,22vw,340px),1fr)}
  }
  @media (max-width:700px){.side .empty{font-size:15px;padding:8px 10px}}
  @media (max-width:980px) and (orientation:portrait),(max-width:700px){
    body{height:auto;min-height:100dvh}.grid{flex:none;grid-template-columns:minmax(0,1fr)}
    .stwrap{container-type:inline-size;display:block}.stage{width:100%}.side .col{position:static}.side .col .box,.side .col .box.hist,.side .col .box.logb{flex:none;max-height:60vh}}
  @media (max-height:520px) and (orientation:landscape){.sub{display:none}.top{padding:4px 10px}.grid{padding:6px 10px;gap:8px}.tick{margin:0 10px 6px}.tick .lab{padding:6px}}
  @media (max-width:520px){.stats{display:none}.alert{width:62%}.brand{font-size:11px}.top{gap:8px;padding:8px 10px}.grid{padding:10px}.tick{margin:0 10px 10px}.hud{font-size:9px;padding:5px 7px;order:3}}
  @media (prefers-reduced-motion:reduce){.tick .run{animation-duration:90s}}
  /* 0.32.479 (pedido do dono): Sala no celular em formato de app (salaapp.js põe html.sapp só no celular em pé). Barra de baixo,
     telas que rolam, cartões e janela de detalhes no mesmo visual pixel. Fora do celular nada disso aparece. */
  .sbar,.sapages,.sasheet{display:none}
  html.sapp body{display:block;height:auto;min-height:100dvh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  html.sapp .top{position:sticky;top:0;z-index:5;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;gap:6px 8px}
  html.sapp .ctl,html.sapp .side,html.sapp .stage .alert ~ .stats{display:none}
  html.sapp .brand{font-size:10px}html.sapp .live{font-size:8px;padding:4px 6px}
  html.sapp .hud{font-size:8px;padding:4px 6px;order:3}html.sapp #mood{order:4}
  html.sapp .sub{font-size:13px;padding:4px 10px}
  html.sapp .grid{padding:8px 8px 4px;gap:8px}
  html.sapp .tick{margin:0 8px 8px}
  html.sapp body:not([data-tab="vivo"]) .grid,html.sapp body:not([data-tab="vivo"]) .tick,html.sapp body:not([data-tab="vivo"]) #saKpi,
  html.sapp body:not([data-tab="vivo"]) .sub{display:none}
  html.sapp .sapages{display:block;padding:0 8px}
  html.sapp .sapg{display:none}
  html.sapp body[data-tab="abertas"] #pg_abertas,html.sapp body[data-tab="hist"] #pg_hist,html.sapp body[data-tab="log"] #pg_log,
  html.sapp body[data-tab="menu"] #pg_menu{display:block;padding-top:8px}
  .sakpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 8px}
  .sakpis.in{margin:8px 0}
  .sak{background:#060c1c;border:2px solid var(--line);padding:6px 8px;min-width:0;box-shadow:3px 3px 0 #050914}
  .sak small{display:block;font-family:"Press Start 2P",monospace;font-size:7px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sak b{display:block;font-size:22px;line-height:1.05;margin-top:3px;overflow-wrap:anywhere}.sak b.rl{color:var(--yellow)}.sak b.fc{color:var(--neon)}
  .sau{display:block;font-size:15px;color:var(--muted);font-weight:normal}
  .sabox{margin:6px 4px 16px;background:var(--panel);box-shadow:0 0 0 3px #0a0f20,0 0 0 6px var(--line),6px 6px 0 6px #050914}
  .sabox h3{margin:0;display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:10px;background:linear-gradient(#24407e,#1a2f5e);color:#fff;text-shadow:2px 2px 0 #0a0f20;border-bottom:3px solid #0a0f20}
  .sabox h3 .ico{height:16px}.sabox h3 .dots{margin-left:auto;display:flex;gap:4px}
  .sabox h3 .dots b{width:8px;height:8px;background:#3df2c4;box-shadow:0 0 0 2px #0a0f20}.sabox h3 .dots b:nth-child(2){background:#ffd23f}.sabox h3 .dots b:nth-child(3){background:#ff4d5e}
  .sabd{padding:10px}
  .salist{display:flex;flex-direction:column;gap:8px}
  .sacard{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;padding:8px 10px;cursor:pointer;
    background:#0b1430;border:2px solid #22365f;border-left:6px solid var(--yellow);font-family:"VT323",monospace;color:var(--text)}
  .sacard.up{border-left-color:var(--green)}.sacard.down{border-left-color:var(--red)}
  .sacard:active{transform:translate(2px,2px)}.sacard:focus-visible{outline:2px solid var(--neon)}
  .sct{display:flex;align-items:center;gap:6px;min-width:0;font-size:22px}.sct b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saab{font-style:normal;font-size:14px;color:#c4b5fd;border:1px solid #4c3b8a;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .scp{font-size:24px;font-weight:bold;text-align:right}
  .scl{grid-column:1/-1;color:var(--muted);font-size:16px;overflow-wrap:anywhere}
  .scv{grid-column:1/-1;font-size:17px;overflow-wrap:anywhere}.scv .sau{display:inline;font-size:14px}
  .saday{margin:10px 0 2px;font-size:9px;color:var(--neon)}
  .sachips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .sachips button,.saseg button{font-size:9px;background:#0a1226;color:var(--muted);border:2px solid var(--line);padding:9px 10px;cursor:pointer;border-radius:3px;min-height:38px}
  .sachips button.on,.saseg button.on{background:var(--neon);color:#06221b;border-color:var(--neon)}
  .saseg button.real.on{background:var(--yellow);border-color:var(--yellow);color:#2a1d00}
  .saseg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.saseg button{flex:1 1 0}.saseg button:disabled{opacity:.4}
  .saq{width:100%;font-family:"VT323",monospace;font-size:18px;background:#060c1c;color:var(--text);border:2px solid var(--line);padding:8px 10px;margin-bottom:4px}
  .saempty{color:var(--muted);font-size:18px;margin:8px 0}
  .sanote{color:var(--muted);font-size:16px;margin:4px 4px 10px}
  .sabtn{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;font-size:9px;background:#18264a;color:var(--text);
    border:2px solid var(--line);padding:12px 10px;margin:8px 4px 14px;cursor:pointer;box-shadow:3px 3px 0 #050914;min-height:44px}
  .sabtn .ico{height:16px;margin:0}
  .sagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sagrid .sabtn{margin:0}
  .salog{background:#020a06;padding:6px 8px;font-size:17px;line-height:1.1;color:#3ee66b;max-height:none}
  .sall{padding:4px 0;border-bottom:1px dashed #0c2a18;overflow-wrap:anywhere}
  .sall .lt{color:#4f7a5e}.sall .lr{display:block;color:#7fa58c}
  .sall.no b{color:#8fa3d1}.sall.wait b{color:#6fd3ff}.sall.real b{color:#ffd23f}.sall.bad b{color:#ff4d5e}.sall.sell b{color:#ff9f1c}.sall.ok b{color:#3ee66b}
  .salog .cur{color:#3ee66b;animation:blink 1s steps(2) infinite}
  html.sapp .sbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:8;background:#0e1730;
    border-top:3px solid var(--line);box-shadow:0 -4px 0 #050914;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .sbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);padding:6px 0;cursor:pointer;min-height:54px}
  .sbar button .ico{height:22px;width:auto;margin:0;filter:grayscale(.7) brightness(.8)}
  .sbar button span{font-size:7px;letter-spacing:0}
  .sbar button.on{color:var(--neon);background:#18264a;box-shadow:inset 0 3px 0 var(--neon)}.sbar button.on .ico{filter:none}
  .sbar em{position:absolute;top:2px;right:calc(50% - 22px);font-style:normal;font-size:14px;line-height:1;background:var(--red);color:#fff;padding:1px 4px;border:2px solid #0a0f20}
  html.sapp .sasheet:not([hidden]){display:block;position:fixed;inset:0;z-index:20}
  .sashd{position:absolute;inset:0;background:rgba(2,5,14,.75)}
  .sasp{position:absolute;left:0;right:0;bottom:0;max-height:85dvh;overflow:auto;background:var(--panel);border-top:4px solid var(--neon);
    box-shadow:0 -6px 0 #050914;padding-bottom:env(safe-area-inset-bottom);animation:sasu .25s steps(4)}
  @keyframes sasu{from{transform:translateY(40%)}to{transform:none}}
  .sasp h3{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:10px 12px;font-size:10px;background:linear-gradient(#24407e,#1a2f5e);color:#fff}
  .sasp h3 button{font-size:10px;background:var(--red);color:#fff;border:2px solid #0a0f20;padding:8px 11px;cursor:pointer}
  .sasb{padding:12px}
  .sabig{font-size:44px;font-weight:bold;line-height:1;margin-bottom:10px}.sabig small{display:block;font-size:20px;margin-top:4px}
  .sadr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #1a2850;font-size:18px}
  .sadr small{color:var(--muted);font-size:16px;flex:0 0 auto}.sadr span{text-align:right;overflow-wrap:anywhere;min-width:0}
  .sadr code{font-family:"VT323",monospace}
  .sasb .sagrid{margin-top:12px}
  body.sashow{overflow:hidden}
  @media (prefers-reduced-motion:reduce){.sasp{animation:none}}
</style>
</head>
