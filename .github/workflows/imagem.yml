# A cada push no main: roda os testes e, se passarem, publica a imagem no GitHub (ghcr.io).
# O Portainer só precisa puxar a imagem nova ("Update the stack" com "Re-pull image").
name: testes e imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: nome da imagem em minúsculas
        run: echo "IMG=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:${{ github.sha }}

  # Atualização automática (estilo Vercel): depois que a imagem nova está publicada, avisa o Portainer
  # pelo webhook do serviço, que baixa a imagem nova e reinicia sozinho. Só roda se o segredo
  # PORTAINER_WEBHOOK_URL existir no repositório (Settings → Secrets and variables → Actions).
  deploy:
    needs: imagem
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: avisar o Portainer
        if: env.WEBHOOK != ''
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK")
          echo "Portainer respondeu HTTP $code"
          test "$code" -lt 300
      - uses: actions/checkout@v4
        if: env.WEBHOOK != ''
      - name: conferir se a versão NOVA está no ar
        if: env.WEBHOOK != ''
        run: |
          esperada=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/version.py').read()).group(1).split(' ')[0])")
          echo "Versão esperada: $esperada"
          for i in $(seq 1 30); do
            sleep 10
            v=$(curl -s https://pump.rachar.app.br/health || true)
            echo "$v"
            echo "$v" | grep -q "\"version\":\"$esperada " && { echo "OK: versão $esperada no ar"; exit 0; }
          done
          echo "A versão $esperada não apareceu em 5 minutos — confira o serviço no Portainer"; exit 1
      - name: sem webhook configurado
        if: env.WEBHOOK == ''
        run: echo "PORTAINER_WEBHOOK_URL não configurado — atualize pelo Portainer (Update the stack + Re-pull image)."
