## PUMP FUN COPY (PUMP.FUN Bruxo Bode) — stack do Portainer (Swarm + Traefik).
## Este é o modelo que está no Portainer (formato do dono, 01/11/2026), com as melhorias para o projeto atual.
## Environment variables do stack (Portainer → Stacks → pump_bruxo_bode → Environment variables):
##   SUPABASE_ANON_KEY          chave anon (pública)
##   SUPABASE_SERVICE_ROLE_KEY  chave service_role (SECRETA)
##   APP_ENCRYPTION_KEY         chave mestra — sempre a MESMA; se trocar, as chaves salvas no painel param de abrir
##   PUMP_REAL_ALLOWED          true = carteira REAL liberada; sem a variável = false (travada para todos)
##   SOLANA_RPC_PUBLIC          RPC próprio https (ex.: Helius); sem a variável = RPC público da Solana
##   PUMP_RPC_WS                o mesmo RPC em wss:// (WebSocket do monitor); sem a variável = público
##   ARQUIVO_DB_PASSWORD        senha do usuário pump_arquivo_auth no Postgres da VPS (deploy/arquivo.sql)  [0.32.225]
##   ARQUIVO_JWT_SECRET         segredo do PostgREST do arquivo (40+ letras e números, inventado por você)    [0.32.225]
##   Sem as duas, o arquivo fica desligado e tudo funciona como antes (histórico só no Supabase).
## Nunca coloque os valores das chaves neste arquivo.
version: "3.7"
services:

## --------------------------- PUMP.FUN BRUXO BODE --------------------------- ##

  pump_bruxo_bode:
    image: ghcr.io/bruxo95/pump.fun_bruxo_bode:latest

    networks:
      - vpsrachar

    environment:
      - PUBLIC_BASE_URL=https://pump.rachar.app.br
      - PORT=8080
      - TZ_PAINEL=Europe/Berlin
      - SUPABASE_URL=https://vnvfluimpqvxbvdbmwqa.supabase.co
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - SOLANA_RPC_PUBLIC=${SOLANA_RPC_PUBLIC:-https://api.mainnet-beta.solana.com}
      - PUMP_RPC_WS=${PUMP_RPC_WS:-wss://api.mainnet-beta.solana.com}
      - PUMP_REAL_ALLOWED=${PUMP_REAL_ALLOWED:-false}
      - ARQUIVO_URL=http://pump_arquivo_api:3000
      - ARQUIVO_JWT_SECRET=${ARQUIVO_JWT_SECRET:-}

    # logs do container com limite (30 MB no máximo): o disco cheio de 01/11/2026 derrubou o site
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      replicas: 1
      # nunca 2 ao mesmo tempo: cada cópia do servidor compraria e venderia sozinha (stop-first = desliga a antiga antes)
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.pump_bruxo_bode.rule=Host(`pump.rachar.app.br`)
        - traefik.http.routers.pump_bruxo_bode.entrypoints=websecure
        - traefik.http.routers.pump_bruxo_bode.tls.certresolver=letsencryptresolver
        - traefik.http.routers.pump_bruxo_bode.service=pump_bruxo_bode
        - traefik.http.services.pump_bruxo_bode.loadbalancer.server.port=8080
        - traefik.http.services.pump_bruxo_bode.loadbalancer.passHostHeader=true

  # 0.32.225: PostgREST na frente do banco pump_arquivo do Postgres da VPS (stack "postgres"). Sem porta e sem Traefik:
  # só a rede interna; só aceita pedido com token assinado com ARQUIVO_JWT_SECRET (sem papel anônimo).
  pump_arquivo_api:
    image: postgrest/postgrest:v12.2.3

    networks:
      - vpsrachar

    environment:
      - PGRST_DB_URI=postgres://pump_arquivo_auth:${ARQUIVO_DB_PASSWORD:-sem_senha}@postgres:5432/pump_arquivo
      - PGRST_DB_SCHEMAS=public
      - PGRST_JWT_SECRET=${ARQUIVO_JWT_SECRET:-}
      - PGRST_DB_POOL=5
      - PGRST_DB_MAX_ROWS=5000
      - PGRST_LOG_LEVEL=warn

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      placement:
        constraints:
          - node.role == manager

## --------------------------- PUMP.FUN BRUXO BODE --------------------------- ##

networks:
  vpsrachar:
    external: true
    name: vpsrachar
